[global]
# Generated by Hexlet.
exclude = [".github/workflows/README.md"]
# Apply exclude to files passed explicitly too (hk passes staged files).
force_exclude = true
line_length = 120

[MD033]
# The collapsible section from the Hexlet README template.
allowed-elements = ["details", "summary"]

[per-file-ignores]
# Exception, human decision in https://github.com/sergdenisov/ai-for-developers-project-386/pull/33: written by
# release-please, which puts two blank lines before each section.
"CHANGELOG.md" = ["MD012"]
# Exception, human decision in https://github.com/sergdenisov/ai-for-developers-project-387/pull/23#issuecomment-6980864964:
# GitHub shows the PR title as the page's heading above the body, so a level 1 heading in the template would repeat it.
".github/pull_request_template.md" = ["MD041"]
