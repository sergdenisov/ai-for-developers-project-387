name: opencode
# The title names the PR or issue, so the gate can count the runs of one PR from the Actions history (the budget below).
run-name: >-
  ${{ format('opencode {0} #{1}', (github.event.issue.pull_request || github.event.pull_request) && 'PR' || 'issue',
  github.event.issue.number || github.event.pull_request.number) }}

# The OpenCode agent answers a `/oc` or `/opencode` command in a comment on an issue, a pull request or a line of
# its diff. It acts as the OpenCode GitHub App (https://github.com/apps/opencode-agent): the app's token comes from
# the OIDC exchange (`id-token: write`), and the agent replies with a comment and may push to the PR branch or
# open a PR. README.md, "Агент в GitHub", describes the setup.
# Exception, human decision in https://github.com/sergdenisov/ai-for-developers-project-387/pull/7, review by 2027-05-18:
# the agent is called from a comment, so the trigger is issue_comment. The gate job lets only a trusted participant's
# command through and never a PR from a fork; the job with the model key runs code of this repository only.
on:
  # jactionlint ignore=dangerous-triggers
  issue_comment:
    # An edited comment does not call the agent again.
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

# One agent at a time per issue or PR: a second command waits for the running one instead of racing its pushes, and
# `queue: max` keeps every waiting run, so another comment never drops a queued command.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

jobs:
  # Runs without secrets, before the model is called. Lets the agent job start only for a command from a trusted
  # participant (owner, member, collaborator; never a bot, so the agent never answers itself), on an issue or on a PR
  # from this repository, and on a PR only while its run budget lasts. A PR from a fork is refused: the agent may run
  # its code, and that code must not see the model key.
  gate:
    if: >-
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, '/oc') || contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/opencode') || contains(github.event.comment.body, ' /opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      # The history of this workflow's runs: the budget is counted from it.
      actions: read
    outputs:
      allowed: ${{ steps.decide.outputs.allowed }}
      reason: ${{ steps.decide.outputs.reason }}
      sha: ${{ steps.decide.outputs.sha }}
      used: ${{ steps.decide.outputs.used }}
    steps:
      - name: Decide whether the agent may run
        shell: bash
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          # Agent runs one PR may have; the next command is refused without calling the model.
          BUDGET: 3
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ISSUE_SHA: ${{ github.sha }}
          # The head of a PR on a line comment; on a PR conversation comment the head is known only from the API.
          EVENT_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          # Set on a comment in the PR conversation (issue_comment); empty on an issue.
          ISSUE_PR_URL: ${{ github.event.issue.pull_request.url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # Set on a comment on a line of the diff (pull_request_review_comment).
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$REVIEW_PR_NUMBER" ]; then
            pr="$REVIEW_PR_NUMBER"
          elif [ -n "$ISSUE_PR_URL" ]; then
            pr="$ISSUE_NUMBER"
          else
            pr=""
          fi
          if [ -z "$pr" ]; then
            echo "sha=$ISSUE_SHA" >> "$GITHUB_OUTPUT"
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Known before the API call, so a report of a gate that fails below names the right commit or none.
          echo "sha=${EVENT_PR_HEAD:-unknown}" >> "$GITHUB_OUTPUT"
          read -r head_repo sha created < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" \
            --jq '"\(.head.repo.full_name) \(.head.sha) \(.created_at)"')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::notice::The agent does not run on pull requests from forks ($head_repo)."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "reason=fork" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Every admitted run of this PR counts: an agent job that was not skipped, whatever its result (a cancel, a
          # timeout and every Re-run attempt included), except this attempt itself. The history lives in Actions,
          # which the agent's token cannot rewrite; a comment is only a report.
          # An assignment, not `for … in $(…)`: a failed API call must stop the gate (fail closed), not count zero.
          ids=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/opencode.yml/runs?per_page=100&created=>=$created" \
            --jq ".workflow_runs[] | select(.display_title == \"opencode PR #$pr\") | .id")
          used=0
          for id in $ids; do
            n=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?filter=all&per_page=100" \
              --jq "[.jobs[] | select(.name == \"opencode\" and .conclusion != \"skipped\"
                and (.run_id != $RUN_ID or .run_attempt != $RUN_ATTEMPT))] | length" | awk '{ s += $1 } END { print s + 0 }')
            used=$((used + n))
          done
          echo "used=$used" >> "$GITHUB_OUTPUT"
          echo "Agent runs of PR #$pr: $used of $BUDGET."
          if [ "$used" -ge "$BUDGET" ]; then
            echo "::warning::The run budget of PR #$pr is spent ($used of $BUDGET): the model is not called."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "reason=limit_exhausted" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi

  opencode:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    # implement-spec runs a whole graph of tickets in one session. The agent itself stops at 55 minutes (`timeout` in
    # Run OpenCode), so that its exit code tells a timeout apart from other failures for the report job.
    timeout-minutes: 60
    outputs:
      started: ${{ steps.start.outputs.started }}
      exit-code: ${{ steps.agent.outputs.exit-code }}
    permissions:
      # Checkout; the agent writes through the GitHub App token, not this one.
      contents: read
      # The OIDC token that is exchanged for the GitHub App token.
      id-token: write
    env:
      # mise-action would run the postinstall hook (`mise run install`); the agent runs it when it needs checks.
      MISE_NO_HOOKS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tools from mise.toml, so the commands in AGENTS.md (`mise run check` and others) work on the runner.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.10.21

      # Locally the skills come from the Claude Code plugin mattpocock-skills (README.md, "Агенты"), outside the
      # repository. Install the same release, pinned to its commit, as global OpenCode skills; outside the
      # workspace, so the agent never commits them.
      - name: Install the mattpocock-skills skills
        shell: bash
        env:
          SKILLS_REPO: mattpocock/skills
          # mattpocock-skills 1.3.1, the version of the plugin.
          SKILLS_SHA: 49dd158d1076134a641b33efb035946536778336
        run: |
          src="$RUNNER_TEMP/skills"
          dest="$HOME/.config/opencode/skills"
          mkdir -p "$src" "$dest"
          curl -fsSL "https://codeload.github.com/$SKILLS_REPO/tar.gz/$SKILLS_SHA" | tar -xz -C "$src" --strip-components=1
          # The plugin manifest lists the skills it ships.
          jq -r '.skills[]' "$src/.claude-plugin/plugin.json" | while read -r skill; do
            cp -R "$src/$skill" "$dest/"
          done
          for skill in to-spec to-tickets implement-spec; do
            test -f "$dest/$skill/SKILL.md"
          done
          ls "$dest"

      # `gh` for the agent (docs/agents/issue-tracker.md) acts as the GitHub App, like its comments and pushes: skills
      # such as to-spec, to-tickets and implement-spec file issues and open PRs as opencode-agent[bot]. A PR opened
      # with GITHUB_TOKEN would not start check.yml; one opened by the app does. The exchange is the one the action
      # makes itself (oidc_base_url), for a token of its own; the last step revokes it.
      - name: Get a GitHub App token for gh
        id: app-token
        shell: bash
        env:
          OIDC_AUDIENCE: opencode-github-action
          EXCHANGE_URL: https://api.opencode.ai/exchange_github_app_token
        run: |
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE" | jq -er .value)
          echo "::add-mask::$oidc"
          token=$(curl -fsS -X POST -H "Authorization: Bearer $oidc" "$EXCHANGE_URL" | jq -er .token)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      # The steps of the action anomalyco/opencode/github, run here with a pinned and verified OpenCode. The action asks
      # the GitHub API for the latest release without a token, and on a shared runner that call fails often enough to
      # break a run before the agent starts; it would also install whatever OpenCode was released last.
      - name: Install OpenCode
        shell: bash
        env:
          OPENCODE_VERSION: 1.19.6
          # The digest GitHub lists for the opencode-linux-x64.tar.gz asset of that release.
          OPENCODE_SHA256: 47734e08968b30cc22a0bffb6d9feeed76ad4aa743213a12122040392d09a057
        run: |
          archive="$RUNNER_TEMP/opencode.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v$OPENCODE_VERSION/opencode-linux-x64.tar.gz"
          echo "$OPENCODE_SHA256  $archive" | sha256sum -c -
          mkdir -p "$HOME/.opencode/bin"
          tar -xzf "$archive" -C "$HOME/.opencode/bin" opencode
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Check the model key
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::error::The OPENCODE_API_KEY secret is not set."
            exit 1
          fi

      # Everything before this step is preparation: a failure there is `infra` in the report.
      - name: Mark the agent start
        id: start
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Run OpenCode
        shell: bash
        id: agent
        run: |
          set +e
          timeout 55m opencode github run
          code=$?
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Nobody answers a permission prompt on the runner: an `ask` waits until the timeout. Give an answer to every
          # rule OpenCode 1.19 asks by default. Paths outside the checkout (/tmp and the like) are allowed, as the shell
          # already reaches them; a doom loop and .env files are denied.
          OPENCODE_PERMISSION: >-
            {"external_directory": "allow", "doom_loop": "deny", "read": {"*.env": "deny", "*.env.*": "deny"}}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # OpenCode Zen, which the OPENCODE_API_KEY key pays for. DeepSeek's newest model there, much cheaper than
          # DeepSeek V4 Pro and Claude Sonnet.
          MODEL: opencode/deepseek-v4.1-flash
          # The default commands, stated so the README and the `if` of the gate job stay in step with them.
          MENTIONS: /oc,/opencode
          # Sessions are not published: the repository is public and a session holds the task's context.
          # OpenCode 1.19 does not read it, having discontinued session sharing; kept as the recorded decision.
          SHARE: false

      - name: Revoke the GitHub App token of gh
        if: always() && steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api --method DELETE /installation/token

  # Without the model, after the agent job has stopped: when the agent did not run or did not finish, says why in the
  # issue or PR, with the SHA and the logs, so a person picks the next step. A successful agent replies itself.
  report:
    needs: [gate, opencode]
    # A failed gate is reported too; an agent that finished (exit code 0) has replied, even if a later step failed.
    if: >-
      always() && (needs.gate.result == 'failure' || needs.gate.outputs.reason == 'limit_exhausted' ||
      ((needs.opencode.result == 'failure' || needs.opencode.result == 'cancelled') &&
      needs.opencode.outputs.exit-code != '0'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Report why the agent did not finish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          GATE_RESULT: ${{ needs.gate.result }}
          GATE_REASON: ${{ needs.gate.outputs.reason }}
          USED: ${{ needs.gate.outputs.used }}
          SHA: ${{ needs.gate.outputs.sha || 'unknown' }}
          STARTED: ${{ needs.opencode.outputs.started }}
          EXIT_CODE: ${{ needs.opencode.outputs.exit-code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$GATE_RESULT" = failure ]; then
            reason=infra
            detail="Упала проверка перед запуском агента (gate): бюджет не проверен, модель не вызывалась."
          elif [ "$GATE_REASON" = limit_exhausted ]; then
            reason=limit_exhausted
            detail="Бюджет запусков агента на этот PR исчерпан ($USED из 3), модель не вызывалась."
          elif [ "$STARTED" != true ]; then
            reason=infra
            detail="Сбой подготовки до запуска агента: установка инструментов, токен или ключ модели."
          # 124 is the agent's own 55-minute limit; no exit code after the start is the job's 60-minute limit.
          elif [ "$EXIT_CODE" = 124 ] || [ -z "$EXIT_CODE" ]; then
            reason=timeout
            detail="Агент не уложился в отведённое время и был остановлен."
          else
            reason=agent_failed
            detail="Агент завершился ошибкой или прогон остановлен (код \`${EXIT_CODE:-нет}\`); уточните по логу."
          fi
          body="$RUNNER_TEMP/report.md"
          {
            echo "**Нужен человек.** Причина: \`$reason\`. $detail"
            echo
            echo "- SHA: \`$SHA\`"
            echo "- Логи: $RUN_URL"
          } > "$body"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -F "body=@$body" > /dev/null
